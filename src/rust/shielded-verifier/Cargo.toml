[package]
name = "zkc-shielded-verifier"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "zkc_shielded_verifier"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
verifier-fixture = []
orchard-verifier = ["dep:orchard", "dep:rand"]

[dependencies]
orchard = { version = "0.13.1", optional = true }
rand = { version = "0.8", optional = true }
sha2 = "0.10"
